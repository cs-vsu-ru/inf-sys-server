name: Redeploy Image on Prod

on:
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ls ~/prod (before copy)
        shell: bash
        run: |
          echo "===== ~/prod ====="
          ls -la ~/prod || echo "(no ~/prod directory)"
          echo ""
          echo "===== ~/prod/nginx ====="
          ls -la ~/prod/nginx || echo "(no ~/prod/nginx directory)"

      - name: Copy docker-compose to prod dir
        shell: bash
        run: cp prod/docker-compose.yaml ~/prod/docker-compose.yaml

      - name: Copy nginx config to prod dir
        shell: bash
        run: cp prod/nginx/config.nginx ~/prod/nginx/config.nginx

      - name: Login to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Redeploy containers
        shell: bash
        env:
          EMAIL_LOGIN: ${{ secrets.EMAIL_LOGIN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -e
          cd ~/prod
          docker compose pull
          docker compose build --pull --no-cache
          docker compose up -d
          docker ps

      - name: Debug nginx config (TEMP)
        shell: bash
        run: |
          echo "===== ~/prod/nginx/config.nginx on host ====="
          grep -n -i "client_max_body_size\|server_name\|location" ~/prod/nginx/config.nginx || true
          echo ""
          echo "===== /etc/nginx/nginx.conf inside container ====="
          docker exec nginx grep -n -i "client_max_body_size\|server_name\|location" /etc/nginx/nginx.conf || true
          echo ""
          echo "===== /etc/nginx/conf.d/default.conf inside container ====="
          docker exec nginx sh -c 'if [ -f /etc/nginx/conf.d/default.conf ]; then grep -n -i "client_max_body_size\|server_name\|location" /etc/nginx/conf.d/default.conf; else echo "(file not present)"; fi' || true
          echo ""
          echo "===== nginx -T effective config (grep) ====="
          docker exec nginx nginx -T 2>/dev/null | grep -n -i "client_max_body_size\|server_name" || echo "client_max_body_size NOT FOUND in effective config"