name: Redeploy Image on Prod

on:
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ls ~/prod (before copy)
        shell: bash
        run: |
          echo "===== ~/prod ====="
          ls -la ~/prod || echo "(no ~/prod directory)"
          echo ""
          echo "===== ~/prod/nginx ====="
          ls -la ~/prod/nginx || echo "(no ~/prod/nginx directory)"

      - name: Copy docker-compose to prod dir
        shell: bash
        run: cp prod/docker-compose.yaml ~/prod/docker-compose.yaml

      - name: Copy nginx config to prod dir
        shell: bash
        run: cp prod/nginx/config.nginx ~/prod/nginx/config.nginx

      - name: Login to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Redeploy containers
        shell: bash
        env:
          EMAIL_LOGIN: ${{ secrets.EMAIL_LOGIN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -e
          cd ~/prod
          docker compose pull
          docker compose build --pull --no-cache
          docker compose up -d
          docker ps